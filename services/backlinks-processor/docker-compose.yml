services:
  backlinks-processor-service:
    build: .
    # image: ghcr.io/ionelpopjara/moogle/backlinks-processor:latest
    env_file: "variables.env"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health/ready' % os.getenv('BACKLINKS_PROCESSOR_HEALTH_PORT', '2116'))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
