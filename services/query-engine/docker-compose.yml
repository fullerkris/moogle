services:
    laravel:
        build: .
        image: query-engine-image
        working_dir: /var/www
        volumes:
            - ./public:/var/www/public
            - /var/www/vendor
            - /var/www/node_modules
        environment:
            - APP_ENV=local
            - APP_DEBUG=true
            - QUERY_REDIS_URL=redis://redis:6379/0
            - CACHE_REDIS_URL=redis://redis:6379/1
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "php -v >/dev/null 2>&1 && test -f /var/www/public/build/manifest.json"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s
        deploy:
            resources:
                limits:
                    cpus: "1.00"
                    memory: 1024M
                reservations:
                    cpus: "0.25"
                    memory: 256M
        networks:
            - app

    caddy:
        image: caddy:2
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile
            - ./public:/srv
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - laravel
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "caddy version >/dev/null 2>&1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: "0.50"
                    memory: 256M
                reservations:
                    cpus: "0.10"
                    memory: 128M
        networks:
            - app

    redis:
        image: redis:7
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: "0.50"
                    memory: 512M
                reservations:
                    cpus: "0.10"
                    memory: 128M
        networks:
            - app

volumes:
    caddy_data:
    caddy_config:
    redis_data:

networks:
    app:
        driver: bridge
