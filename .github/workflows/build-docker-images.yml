on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        service:
          [
            spider,
            indexer,
            backlinks-processor,
            tfidf,
            page-rank,
            image-indexer,
          ]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log into registry ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        working-directory: ./services/${{ matrix.service }}
        run: |
          docker build -t ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/${{ matrix.service }}:latest .

      - name: Push Docker image
        run: docker push ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/${{ matrix.service }}:latest

      - name: Upload docker-compose artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-docker-compose
          path: ./services/${{ matrix.service }}/docker-compose.yml

  deploy:
    name: Copy docker-compose files to server
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service:
          [
            spider,
            indexer,
            backlinks-processor,
            tfidf,
            page-rank,
            image-indexer,
          ]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ${{ matrix.service }} docker artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-docker-compose
          path: ./docker-compose-artifacts/

      - name: Debug artifacts
        run: ls -R ./docker-compose-artifacts/

      - name: Create destination directory on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: mkdir -p ~/SearchEngine/${{ matrix.service }}

      - name: Copy docker-compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "./docker-compose-artifacts/docker-compose.yml"
          target: "~/SearchEngine/${{ matrix.service }}/"
          strip_components: 1

  build-runtime-metrics-exporter:
    name: Build Runtime Metrics Exporter Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log into registry ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build runtime metrics exporter image
        run: |
          IMAGE_BASE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          RELEASE_TAG="${{ github.ref_name }}"

          docker build \
            -t "${IMAGE_BASE}/runtime-metrics-exporter:latest" \
            -t "${IMAGE_BASE}/runtime-metrics-exporter:${RELEASE_TAG}" \
            observability/exporters/runtime-metrics

      - name: Push runtime metrics exporter image
        run: |
          IMAGE_BASE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          RELEASE_TAG="${{ github.ref_name }}"

          docker push "${IMAGE_BASE}/runtime-metrics-exporter:latest"
          docker push "${IMAGE_BASE}/runtime-metrics-exporter:${RELEASE_TAG}"
