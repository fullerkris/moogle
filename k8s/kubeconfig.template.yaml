apiVersion: v1
kind: Config
clusters:
  - name: moogle-cluster
    cluster:
      server: https://YOUR_K8S_API_SERVER:6443
      certificate-authority: /absolute/path/to/cluster-ca.crt

users:
  - name: moogle-deployer
    user:
      token: YOUR_BEARER_TOKEN

contexts:
  - name: moogle-context
    context:
      cluster: moogle-cluster
      user: moogle-deployer
      namespace: moogle

current-context: moogle-context
