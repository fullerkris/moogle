apiVersion: v1
kind: ConfigMap
metadata:
  name: query-engine-caddyfile
data:
  Caddyfile: |
    :80 {
        encode gzip zstd

        header {
            Strict-Transport-Security "max-age=31536000; includeSubDomains"
            X-Frame-Options "SAMEORIGIN"
            X-Content-Type-Options "nosniff"
            Referrer-Policy "strict-origin-when-cross-origin"
        }

        @api path /api/*
        handle @api {
            rewrite * /index.php
            reverse_proxy query-engine:9000 {
                transport fastcgi {
                    split .php
                    env SCRIPT_FILENAME /var/www/public/index.php
                    env DOCUMENT_ROOT /var/www/public
                    read_timeout 30s
                    write_timeout 30s
                }
            }
        }

        handle {
            rewrite * /index.php
            reverse_proxy query-engine:9000 {
                transport fastcgi {
                    split .php
                    env SCRIPT_FILENAME /var/www/public/index.php
                    env DOCUMENT_ROOT /var/www/public
                    read_timeout 30s
                    write_timeout 30s
                }
            }
        }
    }
