apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongo-backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mongodump
              image: mongo:7
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  TS=$(date +%Y%m%d_%H%M%S)
                  BACKUP_DIR="/backup/${TS}"
                  echo "[$(date -Iseconds)] Starting backup → ${BACKUP_DIR}"
                  mongodump \
                    --host="${MONGO_HOST}" \
                    --port="${MONGO_PORT:-27017}" \
                    --username="${MONGO_INITDB_ROOT_USERNAME}" \
                    --password="${MONGO_INITDB_ROOT_PASSWORD}" \
                    --authenticationDatabase=admin \
                    --out="${BACKUP_DIR}"
                  echo "[$(date -Iseconds)] Backup complete: ${BACKUP_DIR}"
                  find /backup -maxdepth 1 -mindepth 1 -type d -mtime +7 -exec rm -rf {} +
                  echo "[$(date -Iseconds)] Pruned backups older than 7 days"
              env:
                - name: MONGO_HOST
                  valueFrom:
                    secretKeyRef:
                      name: moogle-runtime-secrets
                      key: MONGO_HOST
                - name: MONGO_PORT
                  valueFrom:
                    secretKeyRef:
                      name: moogle-runtime-secrets
                      key: MONGO_PORT
                - name: MONGO_INITDB_ROOT_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: moogle-runtime-secrets
                      key: MONGO_INITDB_ROOT_USERNAME
                - name: MONGO_INITDB_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: moogle-runtime-secrets
                      key: MONGO_INITDB_ROOT_PASSWORD
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: mongo-backup-pvc
