services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - laravel
    restart: unless-stopped
    networks:
      - edge
      - app

  laravel:
    image: query-engine-image:latest
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?set APP_KEY}
      APP_URL: ${APP_URL:?set APP_URL}
      QUERY_REDIS_URL: ${QUERY_REDIS_URL:?set QUERY_REDIS_URL}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:?set CACHE_REDIS_URL}
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE:?set MONGODB_DATABASE}
    depends_on:
      - query-redis
      - mongo
    restart: unless-stopped
    networks:
      - app

  query-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    volumes:
      - query_redis_data:/data
    networks:
      - app

  pipeline-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    volumes:
      - pipeline_redis_data:/data
    networks:
      - app

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?set MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set MONGO_INITDB_ROOT_PASSWORD}
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - app

networks:
  edge:
    driver: bridge
  app:
    driver: bridge

volumes:
  mongo_data:
  query_redis_data:
  pipeline_redis_data:
