services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../services/query-engine/public:/var/www/public:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      laravel:
        condition: service_healthy
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 256M
    mem_reservation: 128M
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "caddy version >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 128
        reservations:
          cpus: "0.10"
          memory: 128M
    networks:
      - edge
      - query

  laravel:
    image: query-engine-image:latest
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?set APP_KEY}
      APP_URL: ${APP_URL:?set APP_URL}
      QUERY_REDIS_URL: ${QUERY_REDIS_URL:?set QUERY_REDIS_URL}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:?set CACHE_REDIS_URL}
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE:?set MONGODB_DATABASE}
    depends_on:
      query-redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    cpus: "1.00"
    mem_limit: 1024M
    mem_reservation: 256M
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null 2>&1 && test -f /var/www/public/build/manifest.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
          pids: 256
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - query
      - data

  spider:
    image: ghcr.io/ionelpopjara/moogle/spider:latest
    environment:
      PIPELINE_REDIS_URL: ${PIPELINE_REDIS_URL:?set PIPELINE_REDIS_URL}
      STARTING_URL: ${SPIDER_STARTING_URL:-https://en.wikipedia.org/wiki/Web_crawler}
      SPIDER_CRAWL_MODE: ${SPIDER_CRAWL_MODE:-open}
      SPIDER_ALLOWLIST_DOMAINS: ${SPIDER_ALLOWLIST_DOMAINS:-}
      SPIDER_HTTP_TIMEOUT_SECONDS: ${SPIDER_HTTP_TIMEOUT_SECONDS:-10}
      SPIDER_HTTP_MAX_BODY_BYTES: ${SPIDER_HTTP_MAX_BODY_BYTES:-2097152}
      SPIDER_HTTP_USER_AGENT: "${SPIDER_HTTP_USER_AGENT:-MoogleSpider/1.0 (+https://github.com/IonelPopJara/search-engine)}"
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      SPIDER_METRICS_ENABLED: ${SPIDER_METRICS_ENABLED:-true}
      SPIDER_METRICS_ADDR: ${SPIDER_METRICS_ADDR:-:2113}
    depends_on:
      pipeline-redis:
        condition: service_healthy
    restart: unless-stopped
    cpus: "1.00"
    mem_limit: 1024M
    mem_reservation: 256M
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2113/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
          pids: 256
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - pipeline

  indexer:
    image: ghcr.io/ionelpopjara/moogle/indexer:latest
    environment:
      INDEXER_HEALTH_PORT: ${INDEXER_HEALTH_PORT:-2114}
      PIPELINE_REDIS_URL: ${PIPELINE_REDIS_URL:?set PIPELINE_REDIS_URL}
      MONGO_HOST: ${MONGO_HOST:-mongo}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_DB: ${MONGO_DB:-moogle}
      MONGO_USERNAME: ${MONGO_USERNAME:?set MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
    depends_on:
      pipeline-redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    cpus: "1.00"
    mem_limit: 1024M
    mem_reservation: 256M
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health/ready' % os.getenv('INDEXER_HEALTH_PORT', '2114'))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
          pids: 256
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - pipeline
      - data

  image-indexer:
    image: ghcr.io/ionelpopjara/moogle/image-indexer:latest
    environment:
      IMAGE_INDEXER_HEALTH_PORT: ${IMAGE_INDEXER_HEALTH_PORT:-2115}
      PIPELINE_REDIS_URL: ${PIPELINE_REDIS_URL:?set PIPELINE_REDIS_URL}
      MONGO_HOST: ${MONGO_HOST:-mongo}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_DB: ${MONGO_DB:-moogle}
      MONGO_USERNAME: ${MONGO_USERNAME:?set MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
    depends_on:
      pipeline-redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    cpus: "1.00"
    mem_limit: 1024M
    mem_reservation: 256M
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health/ready' % os.getenv('IMAGE_INDEXER_HEALTH_PORT', '2115'))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
          pids: 256
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - pipeline
      - data

  backlinks-processor:
    image: ghcr.io/ionelpopjara/moogle/backlinks-processor:latest
    environment:
      BACKLINKS_PROCESSOR_HEALTH_PORT: ${BACKLINKS_PROCESSOR_HEALTH_PORT:-2116}
      PIPELINE_REDIS_URL: ${PIPELINE_REDIS_URL:?set PIPELINE_REDIS_URL}
      MONGO_HOST: ${MONGO_HOST:-mongo}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_DB: ${MONGO_DB:-moogle}
      MONGO_USERNAME: ${MONGO_USERNAME:?set MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
    depends_on:
      pipeline-redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    cpus: "1.00"
    mem_limit: 1024M
    mem_reservation: 256M
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health/ready' % os.getenv('BACKLINKS_PROCESSOR_HEALTH_PORT', '2116'))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
          pids: 256
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - pipeline
      - data

  tfidf:
    image: ghcr.io/ionelpopjara/moogle/tfidf:latest
    environment:
      MONGO_HOST: ${MONGO_HOST:-mongo}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_DB: ${MONGO_DB:-moogle}
      MONGO_USERNAME: ${MONGO_USERNAME:?set MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
      OPERATIONS_THRESHOLD: ${TFIDF_OPERATIONS_THRESHOLD:-1000}
      NUM_THREADS: ${TFIDF_NUM_THREADS:-4}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    cpus: "0.75"
    mem_limit: 768M
    mem_reservation: 192M
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, pymongo; pymongo.MongoClient(host=os.getenv('MONGO_HOST','mongo'), port=int(os.getenv('MONGO_PORT','27017')), username=os.getenv('MONGO_USERNAME'), password=os.getenv('MONGO_PASSWORD')).admin.command('ping')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
          pids: 256
        reservations:
          cpus: "0.20"
          memory: 192M
    networks:
      - data

  page-rank:
    image: ghcr.io/ionelpopjara/moogle/page-rank:latest
    environment:
      MONGO_HOST: ${MONGO_HOST:-mongo}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_DB: ${MONGO_DB:-moogle}
      MONGO_USERNAME: ${MONGO_USERNAME:?set MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    cpus: "0.75"
    mem_limit: 768M
    mem_reservation: 192M
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "nc -z $${MONGO_HOST:-mongo} $${MONGO_PORT:-27017}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
          pids: 256
        reservations:
          cpus: "0.20"
          memory: 192M
    networks:
      - data

  mongo-backup:
    image: mongo:7
    entrypoint: ["/bin/bash", "/scripts/backup.sh"]
    environment:
      MONGO_HOST: ${MONGO_HOST:-mongo.internal}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?set MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set MONGO_INITDB_ROOT_PASSWORD}
      BACKUP_ROOT: /backup
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./scripts/mongo-backup.sh:/scripts/backup.sh:ro
      - mongo_backup:/backup
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 512M
    mem_reservation: 128M
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
          pids: 128
        reservations:
          cpus: "0.05"
          memory: 128M
    networks:
      - data

  query-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 512M
    mem_reservation: 128M
    pids_limit: 128
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
          pids: 128
        reservations:
          cpus: "0.10"
          memory: 128M
    volumes:
      - query_redis_data:/data
    networks:
      query:
        aliases:
          - query-redis.internal

  pipeline-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${PIPELINE_REDIS_PASSWORD:?set PIPELINE_REDIS_PASSWORD}"]
    environment:
      PIPELINE_REDIS_PASSWORD: ${PIPELINE_REDIS_PASSWORD:?set PIPELINE_REDIS_PASSWORD}
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 512M
    mem_reservation: 128M
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$PIPELINE_REDIS_PASSWORD\" ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
          pids: 128
        reservations:
          cpus: "0.10"
          memory: 128M
    volumes:
      - pipeline_redis_data:/data
    networks:
      pipeline:
        aliases:
          - pipeline-redis.internal

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?set MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set MONGO_INITDB_ROOT_PASSWORD}
      MONGODB_DATABASE: ${MONGODB_DATABASE:?set MONGODB_DATABASE}
      MONGODB_QUERY_USERNAME: ${MONGODB_QUERY_USERNAME:?set MONGODB_QUERY_USERNAME}
      MONGODB_QUERY_PASSWORD: ${MONGODB_QUERY_PASSWORD:?set MONGODB_QUERY_PASSWORD}
      MONGO_USERNAME: ${MONGO_USERNAME:?set MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
    restart: unless-stopped
    cpus: "1.00"
    mem_limit: 1024M
    mem_reservation: 256M
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
          pids: 256
        reservations:
          cpus: "0.25"
          memory: 256M
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      data:
        aliases:
          - mongo.internal

networks:
  edge:
    driver: bridge
  query:
    driver: bridge
  pipeline:
    driver: bridge
  data:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  mongo_data:
  mongo_backup:
  query_redis_data:
  pipeline_redis_data:
