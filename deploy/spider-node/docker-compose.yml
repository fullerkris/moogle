services:
  spider-node:
    image: ${SPIDER_IMAGE:-moogle/spider-node:local}
    build:
      context: ../../services/spider
    environment:
      PIPELINE_REDIS_URL: ${PIPELINE_REDIS_URL:?set PIPELINE_REDIS_URL}
      STARTING_URL: ${SPIDER_STARTING_URL:-https://en.wikipedia.org/wiki/Web_crawler}
      SPIDER_CRAWL_MODE: ${SPIDER_CRAWL_MODE:-open}
      SPIDER_ALLOWLIST_DOMAINS: ${SPIDER_ALLOWLIST_DOMAINS:-}
      SPIDER_BLOCKLIST_DOMAINS: ${SPIDER_BLOCKLIST_DOMAINS:-}
      SPIDER_DOMAIN_MATCH_SUBDOMAINS: ${SPIDER_DOMAIN_MATCH_SUBDOMAINS:-true}
      SPIDER_HTTP_TIMEOUT_SECONDS: ${SPIDER_HTTP_TIMEOUT_SECONDS:-10}
      SPIDER_HTTP_MAX_BODY_BYTES: ${SPIDER_HTTP_MAX_BODY_BYTES:-2097152}
      SPIDER_HTTP_USER_AGENT: ${SPIDER_HTTP_USER_AGENT:-MoogleSpider/1.0 (+https://github.com/IonelPopJara/search-engine)}
      SPIDER_ROBOTS_ENABLED: ${SPIDER_ROBOTS_ENABLED:-true}
      SPIDER_ROBOTS_CACHE_TTL_SECONDS: ${SPIDER_ROBOTS_CACHE_TTL_SECONDS:-3600}
      SPIDER_ROBOTS_ALLOW_ON_FETCH_FAILURE: ${SPIDER_ROBOTS_ALLOW_ON_FETCH_FAILURE:-true}
      SPIDER_DEFAULT_CRAWL_DELAY_MS: ${SPIDER_DEFAULT_CRAWL_DELAY_MS:-1000}
      SPIDER_MAX_CONCURRENT_PER_DOMAIN: ${SPIDER_MAX_CONCURRENT_PER_DOMAIN:-1}
      SPIDER_ROBOTS_BYPASS_DOMAINS: ${SPIDER_ROBOTS_BYPASS_DOMAINS:-}
      SPIDER_ROBOTS_BYPASS_SUBDOMAINS: ${SPIDER_ROBOTS_BYPASS_SUBDOMAINS:-true}
      SPIDER_ROBOTS_BYPASS_DELAY_MS: ${SPIDER_ROBOTS_BYPASS_DELAY_MS:-1000}
      SPIDER_METRICS_ENABLED: ${SPIDER_METRICS_ENABLED:-true}
      SPIDER_METRICS_ADDR: ${SPIDER_METRICS_ADDR:-:2113}
      SPIDER_BUDGET_ENABLED: ${SPIDER_BUDGET_ENABLED:-true}
      SPIDER_BUDGET_RUN_MAX_ATTEMPTS: ${SPIDER_BUDGET_RUN_MAX_ATTEMPTS:-50000}
      SPIDER_BUDGET_RUN_MAX_SUCCESSES: ${SPIDER_BUDGET_RUN_MAX_SUCCESSES:-30000}
      SPIDER_BUDGET_DOMAIN_MAX_ATTEMPTS: ${SPIDER_BUDGET_DOMAIN_MAX_ATTEMPTS:-2000}
      SPIDER_BUDGET_BYPASS_MAX_RUN: ${SPIDER_BUDGET_BYPASS_MAX_RUN:-200}
      SPIDER_BUDGET_BYPASS_MAX_DOMAIN: ${SPIDER_BUDGET_BYPASS_MAX_DOMAIN:-50}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    ports:
      - ${SPIDER_METRICS_PORT_BIND:-127.0.0.1:22113}:2113
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2113/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
